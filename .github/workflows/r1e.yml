name: R1e independent grid checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: |
          set -o pipefail
          python -m phispacetime.independent_benchmark | tee r1e-independent-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1e-independent-results
          path: r1e-independent-results.json
