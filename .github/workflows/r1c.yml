name: R1c interface checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: |
          set -o pipefail
          python -m phispacetime.interface_benchmark | tee r1c-interface-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1c-interface-results
          path: r1c-interface-results.json
