name: R1f nonradial checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  nonradial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: |
          set -o pipefail
          python -m phispacetime.nonradial_benchmark | tee r1f-nonradial-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1f-nonradial-results
          path: r1f-nonradial-results.json
