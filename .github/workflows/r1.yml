name: R1 scalar wave checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m phispacetime.wave_benchmark | tee r1-wave-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1-wave-results
          path: r1-wave-results.json
