name: R1g absorbing boundary checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  absorbing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: |
          set -o pipefail
          python -m phispacetime.absorbing_benchmark | tee r1g-absorbing-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1g-absorbing-results
          path: r1g-absorbing-results.json
